name: test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: ['11', '17', '21']
    name: jdk ${{ matrix.jdk }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          lein: 2.11.2
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ matrix.jdk }}-${{ hashFiles('project.clj') }}
          restore-keys: m2-${{ matrix.jdk }}-
      - run: lein test
