name: release

on:
  push:
    tags:
      - 'Release-*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          lein: 2.11.2
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-17-${{ hashFiles('project.clj') }}
          restore-keys: m2-17-
      - run: lein test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          lein: 2.11.2
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-deploy-${{ hashFiles('project.clj') }}
          restore-keys: m2-deploy-
      - name: Import GPG key
        run: |
          GNUPGHOME="$HOME/.gnupg"
          export GNUPGHOME
          mkdir -p "$GNUPGHOME"
          chmod 0700 "$GNUPGHOME"
          echo "$GPG_KEY" | base64 --decode --ignore-garbage | gpg --batch --allow-secret-key-import --import
        env:
          GPG_KEY: ${{ secrets.GPG_KEY }}
      - name: Deploy to Clojars
        env:
          clojars_username: ${{ secrets.CLOJARS_USERNAME }}
          clojars_password: ${{ secrets.CLOJARS_PASSWORD }}
        run: |
          export GPG_TTY=$(tty)
          export PROJECT_VERSION="${GITHUB_REF_NAME#Release-}"
          lein deploy clojars
